name: Publish prebuilt v2.4.2

on:
  push:
    branches: [release-upload/v2.4.2]

permissions:
  contents: read

concurrency:
  group: release-v2.4.2
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -r requirements.txt
      - run: node --test
      - name: Python tests with public failure diagnostics
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-X', 'utf8', '-m', 'unittest', 'discover', '-s', 'test', '-p', '*_test.py'], capture_output=True, text=True, encoding='utf-8')
          print(result.stdout)
          print(result.stderr)
          if result.returncode:
              detail = result.stderr[-14000:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Python offline tests::' + detail)
          sys.exit(result.returncode)

  publish:
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt checksums
        working-directory: _release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft and upload assets
        run: |
          if ! gh release view v2.4.2 >/dev/null 2>&1; then
            gh release create v2.4.2 --target d5f130f364ef6029e7a181aba9b84c025e359cf8 --title '微信直连 v2.4.2：首次开源发布' --notes-file docs/releases/v2.4.2.md --draft --prerelease
          fi
          gh release upload v2.4.2 _release/wechat-direct-2.4.2-windows-x64.zip _release/wechat-direct-2.4.2-source.zip _release/SHA256SUMS.txt --clobber
      - name: Verify server asset digests
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          data = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/releases/tags/v2.4.2']))
          assets = {a['name']: a for a in data['assets']}
          for name in ['wechat-direct-2.4.2-windows-x64.zip', 'wechat-direct-2.4.2-source.zip', 'SHA256SUMS.txt']:
              path = pathlib.Path('_release') / name
              expected = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert assets[name]['size'] == path.stat().st_size, name
              assert assets[name]['digest'] == expected, name
              print(name + ': server checksum verified')
      - name: Publish verified experimental release
        run: gh release edit v2.4.2 --draft=false --prerelease
