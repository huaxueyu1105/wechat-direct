name: Publish prebuilt v2.4.2

on:
  push:
    branches: [release-upload/v2.4.2]

permissions:
  contents: read

concurrency:
  group: release-v2.4.2
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -r requirements.txt
      - run: node --test
      - name: Python tests with public failure diagnostics
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run([sys.executable, '-X', 'utf8', '-m', 'unittest', 'discover', '-s', 'test', '-p', '*_test.py'], capture_output=True, text=True, encoding='utf-8')
          print(result.stdout)
          print(result.stderr)
          if result.returncode:
              detail = result.stderr[-14000:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Python offline tests::' + detail)
          sys.exit(result.returncode)

  publish:
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt checksums
        working-directory: _release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create draft and upload assets
        run: |
          if ! gh release view v2.4.2 >/dev/null 2>&1; then
            gh release create v2.4.2 --target ef01b68679d3e3d6d612acad2778ab0a68a1c041 --title '微信直连 v2.4.2：首次开源发布' --notes-file docs/releases/v2.4.2.md --draft --prerelease
          fi
          gh release upload v2.4.2 _release/wechat-direct-2.4.2-windows-x64.zip _release/wechat-direct-2.4.2-source.zip _release/SHA256SUMS.txt --clobber
      - name: Verify server asset digests
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys, traceback
          try:
              repository = 'repos/' + os.environ['GH_REPO']
              releases = json.loads(subprocess.check_output(['gh', 'api', repository + '/releases?per_page=100']))
              data = next(item for item in releases if item['tag_name'] == 'v2.4.2')
              assets = {a['name']: a for a in data['assets']}
              for name in ['wechat-direct-2.4.2-windows-x64.zip', 'wechat-direct-2.4.2-source.zip', 'SHA256SUMS.txt']:
                  path = pathlib.Path('_release') / name
                  expected = hashlib.sha256(path.read_bytes()).hexdigest()
                  asset = assets[name]
                  assert asset['size'] == path.stat().st_size, name + ': size mismatch'
                  downloaded = subprocess.check_output(['gh', 'api', '-H', 'Accept: application/octet-stream', repository + '/releases/assets/' + str(asset['id'])])
                  assert hashlib.sha256(downloaded).hexdigest() == expected, name + ': downloaded checksum mismatch'
                  print(name + ': server download checksum verified')
          except Exception:
              detail = traceback.format_exc().replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Release asset verification::' + detail)
              sys.exit(1)
      - name: Publish verified experimental release
        run: gh release edit v2.4.2 --draft=false --prerelease
