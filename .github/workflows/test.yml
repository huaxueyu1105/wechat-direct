name: Offline tests
on:
  push:
    branches-ignore: ['release-upload/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - run: python -m pip install -r requirements.txt
      - run: node --test
      - run: python -X utf8 -m unittest discover -s test -p '*_test.py'
